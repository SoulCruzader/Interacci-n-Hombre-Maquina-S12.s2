<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario y Controles Accesibles</title>

    <!-- Bootstrap 5.3 desde CDN (jsDelivr) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Hoja de estilos propia (para el segundo ejemplo) -->
    <link rel="stylesheet" href="estilo.css">
</head>

<body class="p-4">

    <h1 class="mb-5">Prácticas de Accesibilidad Web</h1>

    <!-- SECCIÓN 1: Formulario con Bootstrap -->
    <section class="mb-5 pb-4 border-bottom">
        <h2 class="mb-4">1. Formulario semántico (Bootstrap)</h2>

        <!-- Bootstrap 5.3: controles grandes, etiquetas visibles y foco claro -->
        <form class="vstack gap-3" novalidate>
            <div>
                <label for="dni" class="form-label fs-5">Número de DNI</label>
                <input id="dni" class="form-control form-control-lg" inputmode="numeric" aria-describedby="dni-ayuda">
                <div id="dni-ayuda" class="form-text">
                    8 dígitos. Puedes escribirlos con o sin espacios.
                </div>
            </div>

            <!-- Botones de opción grandes: todo el botón es clicable -->
            <div class="btn-group" role="group" aria-label="Modalidad">
                <input type="radio" class="btn-check" name="modo" id="presencial" checked>
                <label class="btn btn-outline-primary btn-lg" for="presencial">Presencial</label>
                <input type="radio" class="btn-check" name="modo" id="virtual">
                <label class="btn btn-outline-primary btn-lg" for="virtual">Virtual</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg focus-ring">Enviar solicitud</button>
            <p class="visually-hidden" role="status" id="aviso"></p>
        </form>
    </section>

    <!-- SECCIÓN 2: Comparación de Botones -->
    <section>
        <h2 class="mb-4">2. Controles inclusivos (HTML/CSS/JS propio)</h2>

        <h3 class="fs-5">Antes: barrera motora</h3>
        <!-- No recibe foco, no responde a Enter y mide ~18 px de alto -->
        <div class="btn-malo" onclick="guardar('div sin semántica')">Guardar</div>

        <h3 class="fs-5 mt-4">Después: control inclusivo</h3>
        <button type="button" class="btn-bueno" id="guardar">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M5 13l4 4L19 7" />
            </svg>
            Guardar cambios
        </button>

        <!-- Región que anuncia el resultado sin mover el foco -->
        <p id="estado" role="status" class="mt-3"></p>
    </section>

    <!-- JavaScript de Bootstrap desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio: al final del body, cuando el HTML ya existe -->
    <script src="script.js"></script>
</body>

</html>
